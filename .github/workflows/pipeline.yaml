name: Build-Publish-Deploy

env:
  GLOBAL_NEXUS_USERNAME : ${{ secrets.NEXUS_USERNAME }}
  GLOBAL_NEXUS_PASSWORD : ${{ secrets.NEXUS_PASSWORD }}
  GLOBAL_ANYPOINT_CLIENT_ID: ${{ secrets.AP_CLIENT_ID }}
  GLOBAL_ANYPOINT_CLIENT_SECRET: ${{ secrets.AP_CLIENT_SECRET }}
  GLOBAL_CONNECTED_APP_STRING: ${{ secrets.CONNECTED_APP_STRING }}
  GLOBAL_CONNECTED_APP_CLIENT_ID: ${{ secrets.CONNECTED_APP_CLIENT_ID }}
  GLOBAL_CONNECTED_APP_CLIENT_SECRET: ${{ secrets.CONNECTED_APP_CLIENT_SECRET }}
  GLOBAL_GRANT_TYPE: ${{ secrets.GRANT_TYPE }}
  GLOBAL_ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
  GLOBAL_PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
  GLOBAL_ENVIRONMENT: "${{ inputs.environment }}"

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'Enter the repository name'
        required: true
        type: string
      branch:
        description: 'Branch to build'
        required: true
        default: 'dev'
        type: string
      environment:
        description: "Deployment Environment"
        required: true
        type: choice
        options:
          - DEV
          - UAT
          - PROD
      deploymentType:
        description: "Deployment Target Type"
        required: true
        type: choice
        options:
          - "Shared Space"
          - "Private Space"
      deploymentTarget:
        description: "Deployment Target Name (Private Space only — enter exact name from Anypoint. Ignored for Shared Space.)"
        required: false
        default: ''
        type: string
      deploymentRegion:
        description: "Deployment Region (Shared Space only — select N/A for Private Space)"
        required: true
        type: choice
        options:
          - "N/A"
          - "us-east-1"
          - "us-east-2"
          - "us-west-1"
          - "us-west-2"
          - "eu-west-1"
          - "eu-central-1"
          - "ap-southeast-1"
          - "ap-southeast-2"
          - "ap-northeast-1"
          - "ca-central-1"
      vCore:
        description: "vCore on Deployment Target"
        required: true
        type: choice
        options:
          - "0.1"
          - "0.2"
          - "0.5"
          - "1"
          - "2"
          - "4"
      replicas:
        description: "Number of Replicas on Deployment Target"
        required: true
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
          - "6"
          - "7"
          - "8"
      skipMunit:
        description: "Skip MUnit tests (only applicable to DEV)"
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

run-name: "Env: ${{ inputs.environment }} | ${{ inputs.repository }} | Build & Deploy"

jobs:
  Validate-Inputs:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Environment and Branch Mapping
        shell: bash
        run: |
          echo "Validating inputs..."

          BRANCH="${{ inputs.branch }}"
          ENV="${{ inputs.environment }}"
          DEPLOY_TYPE="${{ inputs.deploymentType }}"
          REGION="${{ inputs.deploymentRegion }}"
          TARGET="${{ inputs.deploymentTarget }}"

          echo "Branch: $BRANCH"
          echo "Environment: $ENV"
          echo "Deployment Type: $DEPLOY_TYPE"
          echo "Deployment Target: $TARGET"
          echo "Deployment Region: $REGION"

          case "$ENV" in
            DEV)
              echo "✅ DEV environment allows all branches."
              ;;
            UAT)
              if [[ "$BRANCH" != release/* && "$BRANCH" != hotfix/* ]]; then
                echo "::error::❌ UAT deployments must come from 'release/* or hotfix/*' branches. Provided: '$BRANCH'"
                exit 1
              else
                echo "✅ UAT branch naming is valid."
              fi
              ;;
            PROD)
              if [[ "$BRANCH" != release/* && "$BRANCH" != hotfix/* ]]; then
                echo "::error::❌ PROD deployments must come from 'release/* or hotfix/*' branches. Provided: '$BRANCH'"
                exit 1
              else
                echo "✅ PROD branch naming is valid."
              fi
              ;;
            *)
              echo "::error::❌ Invalid environment: '$ENV'. Must be one of: DEV, UAT, PROD."
              exit 1
              ;;
          esac

          if [[ "$DEPLOY_TYPE" == "Shared Space" && "$REGION" == "N/A" ]]; then
            echo "::error::❌ Deployment Region is required for Shared Space. Please select a valid region."
            exit 1
          fi

          if [[ "$DEPLOY_TYPE" == "Private Space" && -z "$TARGET" ]]; then
            echo "::error::❌ Deployment Target Name is required for Private Space. Enter the exact name from Anypoint Platform."
            exit 1
          fi

          if [[ "$DEPLOY_TYPE" == "Private Space" && "$REGION" != "N/A" ]]; then
            echo "⚠️ Warning: Region is not used for Private Space deployments. It will be ignored."
          fi

          echo "✅ All inputs are valid."

  Build-Publish-Deploy:
    needs: Validate-Inputs
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Maven 3.9.9
        uses: s4u/setup-maven-action@v1.12.0
        with:
          java-version: 17
          maven-version: 3.9.9

      - name: Verify Java and Maven Versions
        run: |
          echo "Java version: $(java -version)"
          echo "Maven version: $(mvn --version)"

      - name: Checkout Selected ${{ inputs.repository }}
        uses: actions/checkout@v4
        with:
          repository: 'swapnil-cci/${{ github.event.inputs.repository }}'
          ref: '${{ github.event.inputs.branch }}'
          token: "${{ env.GLOBAL_PAT_TOKEN }}"
          fetch-depth: 0

      - name: List directory contents
        run: ls -R

      - name: Ensure Last Commit is Tagged for Release
        if: inputs.environment == 'PROD'
        shell: bash
        run: |
          TAG=$(git describe --tags --exact-match HEAD 2>/dev/null || true)
          if [[ -z "$TAG" ]]; then
            echo "::error::No tag on latest commit. PROD requires a SemVer release tag."; exit 1
          fi
          D='0|[1-9][0-9]*'
          PW='[0-9]*[a-zA-Z-][0-9a-zA-Z-]*'
          MW='[0-9a-zA-Z-]+'
          SEMVER_REGEX="^${D}\.${D}\.${D}(-(${D}|${PW})(\.(${D}|${PW}))*)?(\+(${MW}(\.${MW})*))?$"
          if [[ ! "$TAG" =~ $SEMVER_REGEX ]]; then
            echo "::error::Tag '$TAG' is not valid SemVer."; exit 1
          fi
          echo "✅ Valid release tag: $TAG"

      - name: Configure Maven settings
        uses: s4u/maven-settings-action@v3.1.0
        with:
          servers: >
            [
              {
                "id": "anypoint-exchange-v3",
                "username": "~~~Client~~~",
                "password": "${{ env.GLOBAL_CONNECTED_APP_STRING }}"
              },
              {
                "id": "MuleRepository",
                "username": "${{ env.GLOBAL_NEXUS_USERNAME }}",
                "password": "${{ env.GLOBAL_NEXUS_PASSWORD }}"
              }
            ]
          repositories: >
            [
              {
                "id": "anypoint-exchange-v3",
                "url": "https://maven.anypoint.mulesoft.com/api/v3/maven",
                "releases": { "enabled": "true" },
                "snapshots": { "enabled": "true" }
              },
              {
                "id": "MuleRepository",
                "url": "https://repository.mulesoft.org/nexus-ee/content/repositories/releases-ee/",
                "releases": { "enabled": "true" },
                "snapshots": { "enabled": "true" }
              }
            ]

      - name: Set Maven Profile Based on Repository Name
        run: |
          if [[ "${{ inputs.repository }}" == *"exp-api"* ]]; then
            echo "MAVEN_PROFILE=experience-service" >> $GITHUB_ENV
            echo "Set profile to experience-service"
          else
            echo "MAVEN_PROFILE=non-experience-service" >> $GITHUB_ENV
            echo "Set profile to non-experience-service"
          fi

      - name: Set MULE_ENV and APP_TAG
        run: |
          MULE_ENV=$(echo '${{ inputs.environment }}' | tr '[:upper:]' '[:lower:]')
          echo "MULE_ENV=$MULE_ENV" >> $GITHUB_ENV
          if [[ "$MULE_ENV" == "dev" || "$MULE_ENV" == "uat" ]]; then
            echo "APP_TAG=-$MULE_ENV" >> $GITHUB_ENV
          else
            echo "APP_TAG=" >> $GITHUB_ENV
          fi

      - name: Set Deployment Target Properties
        shell: bash
        run: |
          DEPLOY_TYPE="${{ inputs.deploymentType }}"
          TARGET="${{ inputs.deploymentTarget }}"
          REGION="${{ inputs.deploymentRegion }}"

          if [[ "$DEPLOY_TYPE" == "Shared Space" ]]; then
            # For Shared Space (MC), target = region e.g. us-east-2
            echo "DEPLOYMENT_TARGET=$REGION" >> $GITHUB_ENV
            echo "DEPLOYMENT_PROVIDER=MC" >> $GITHUB_ENV
            echo "✅ Shared Space | Target (region): $REGION | Provider: MC"

          elif [[ "$DEPLOY_TYPE" == "Private Space" ]]; then
            # For Private Space (PS), target = exact private space name
            echo "DEPLOYMENT_TARGET=$TARGET" >> $GITHUB_ENV
            echo "DEPLOYMENT_PROVIDER=PS" >> $GITHUB_ENV
            echo "✅ Private Space | Target: $TARGET | Provider: PS"
          fi

      - name: Validate GAV Version Format for Release Branches
        shell: bash
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          BRANCH="${{ inputs.branch }}"

          echo "Detected version: '$VERSION'"
          echo "Detected branch: '$BRANCH'"

          if [[ -z "$VERSION" ]]; then
            echo "::error::❌ Maven returned empty version. Check pom.xml is present in root."
            exit 1
          fi

          if [[ "$BRANCH" == release/* || "$BRANCH" == hotfix/* ]]; then
            if [[ "$VERSION" == *-SNAPSHOT ]]; then
              echo "::error::❌ Release branches must NOT use SNAPSHOT versions. Found: $VERSION"
              exit 1
            else
              echo "✅ Release branch has valid version."
            fi
          else
            if [[ "$VERSION" != *-SNAPSHOT ]]; then
              echo "::error::❌ Non-release branches must use SNAPSHOT versions. Found: $VERSION"
              exit 1
            else
              echo "✅ Non-release branch using valid SNAPSHOT version."
            fi
          fi

      - name: Run MUnit Tests
        if: >
          inputs.environment != 'PROD' &&
          (inputs.environment != 'DEV' || inputs.skipMunit != 'true')
        run: |
          echo "Running MUnit Tests..."
          mvn clean test \
            -D"mule.env"="${{ env.GLOBAL_ENVIRONMENT }}" \
            -D"mule.key"="${{ env.GLOBAL_ENCRYPTION_KEY }}" \
            -D"app.vCores"="${{ inputs.vCore }}" \
            -D"app.replicas"="${{ inputs.replicas }}" \
            -D"app.url.env"="${{ env.APP_TAG }}" \
            -P"${{ env.MAVEN_PROFILE }}"

      - name: Build with Maven
        if: inputs.environment != 'PROD'
        shell: bash
        run: |
          mvn -B clean package -DskipTests \
            -D"mule.env"="${{ env.GLOBAL_ENVIRONMENT }}" \
            -D"environment"="${{ env.GLOBAL_ENVIRONMENT }}" \
            -D"mule.key"="${{ env.GLOBAL_ENCRYPTION_KEY }}" \
            -D"app.vCores"="${{ inputs.vCore }}" \
            -D"app.replicas"="${{ inputs.replicas }}" \
            -D"app.url.env"="${{ env.APP_TAG }}" \
            -D"anypoint.privatespace.name"="${{ env.DEPLOYMENT_TARGET }}" \
            -D"app.deployment.provider"="${{ env.DEPLOYMENT_PROVIDER }}" \
            -D"connectedAppClientId"="${{ env.GLOBAL_CONNECTED_APP_CLIENT_ID }}" \
            -D"connectedAppClientSecret"="${{ env.GLOBAL_CONNECTED_APP_CLIENT_SECRET }}" \
            -D"connectedAppGrantType"="${{ env.GLOBAL_GRANT_TYPE }}" \
            -P"${{ env.MAVEN_PROFILE }}"

      - name: Verify artifact exists in Exchange
        id: check_exchange
        shell: bash
        if: inputs.environment == 'PROD'
        run: |
          CLIENT_ID="${{ env.GLOBAL_CONNECTED_APP_CLIENT_ID }}"
          CLIENT_SECRET="${{ env.GLOBAL_CONNECTED_APP_CLIENT_SECRET }}"
          GRANT_TYPE="${{ env.GLOBAL_GRANT_TYPE }}"

          TOKEN=$(curl -s -X POST "https://anypoint.mulesoft.com/accounts/api/v2/oauth2/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "client_id=$CLIENT_ID&client_secret=$CLIENT_SECRET&grant_type=$GRANT_TYPE" \
            | jq -r '.access_token')

          echo "🔐 Fetched token..."

          ORG_ID=$(mvn help:evaluate -Dexpression=project.groupId -q -DforceStdout)
          ASSET_NAME=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)

          echo "Checking for asset: $ASSET_NAME version: $VERSION"

          RESULT=$(curl -s -X GET \
            "https://anypoint.mulesoft.com/exchange/api/v2/assets/$ORG_ID/$ASSET_NAME/$VERSION" \
            -H "Authorization: Bearer $TOKEN")

          if echo "$RESULT" | grep -q '"version"'; then
            echo "✅ Artifact found in Exchange."
          else
            echo "::error::❌ Artifact version $VERSION not found in Exchange. Cannot deploy."
            exit 1
          fi

      - name: Deploy to Exchange (Skip For PROD)
        if: inputs.environment != 'PROD'
        shell: bash
        run: |
          mvn clean deploy -DskipTests \
            -D"mule.env"="${{ env.GLOBAL_ENVIRONMENT }}" \
            -D"environment"="${{ env.GLOBAL_ENVIRONMENT }}" \
            -D"mule.key"="${{ env.GLOBAL_ENCRYPTION_KEY }}" \
            -D"app.vCores"="${{ inputs.vCore }}" \
            -D"app.replicas"="${{ inputs.replicas }}" \
            -D"app.url.env"="${{ env.APP_TAG }}" \
            -D"anypoint.privatespace.name"="${{ env.DEPLOYMENT_TARGET }}" \
            -D"app.deployment.provider"="${{ env.DEPLOYMENT_PROVIDER }}" \
            -D"connectedAppClientId"="${{ env.GLOBAL_CONNECTED_APP_CLIENT_ID }}" \
            -D"connectedAppClientSecret"="${{ env.GLOBAL_CONNECTED_APP_CLIENT_SECRET }}" \
            -D"connectedAppGrantType"="${{ env.GLOBAL_GRANT_TYPE }}" \
            -P"${{ env.MAVEN_PROFILE }}"

      - name: Deploy to ${{ inputs.environment }}
        shell: bash
        run: |
          mvn clean deploy -DskipTests -DmuleDeploy -e \
            -D"mule.env"="${{ env.GLOBAL_ENVIRONMENT }}" \
            -D"environment"="${{ env.GLOBAL_ENVIRONMENT }}" \
            -D"mule.key"="${{ env.GLOBAL_ENCRYPTION_KEY }}" \
            -D"app.vCores"="${{ inputs.vCore }}" \
            -D"app.replicas"="${{ inputs.replicas }}" \
            -D"app.url.env"="${{ env.APP_TAG }}" \
            -D"anypoint.privatespace.name"="${{ env.DEPLOYMENT_TARGET }}" \
            -D"app.deployment.provider"="${{ env.DEPLOYMENT_PROVIDER }}" \
            -D"connectedAppClientId"="${{ env.GLOBAL_CONNECTED_APP_CLIENT_ID }}" \
            -D"connectedAppClientSecret"="${{ env.GLOBAL_CONNECTED_APP_CLIENT_SECRET }}" \
            -D"connectedAppGrantType"="${{ env.GLOBAL_GRANT_TYPE }}" \
            -D"anypoint.platform.client_id"="${{ env.GLOBAL_ANYPOINT_CLIENT_ID }}" \
            -D"anypoint.platform.client_secret"="${{ env.GLOBAL_ANYPOINT_CLIENT_SECRET }}" \
            -P"${{ env.MAVEN_PROFILE }}"